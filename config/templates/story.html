<!doctype html>
<!--
  ============================================================
  CAFÉ COM TÊNIS — INSTAGRAM STORY TEMPLATE (1080×1920)
  Layout Editorial — safe-areas do Instagram preservadas (~250px topo/rodapé)
  ============================================================
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Story · Café com Tênis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300..800&family=Geist+Mono:wght@400..700&display=swap" rel="stylesheet">

<script id="post-data" type="application/json">
{
  "surface": "grass",
  "badge": "Análise",
  "kicker": "Wimbledon · Semifinal",
  "title": "Por que a grama de Wimbledon mudou em 2026",
  "subtitle": "A nova grama All Court ficou mais lenta — e isso explica por que defensores como Sinner estão dominando.",
  "image": "https://images.unsplash.com/photo-1554068865-24cecd4e34b8?w=1600&q=80",
  "credit": "Getty Images"
}
</script>

<style>
  html,body { margin:0; padding:0; background:#1a1a1c; font-family:Geist,system-ui,sans-serif; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  #frame {
    width:1080px; height:1920px; flex:0 0 auto;
    position:relative; overflow:hidden;
    transform-origin:center center; background:#000; color:#fff;
    box-shadow:0 24px 80px rgba(0,0,0,.6);
  }
  @media (max-height: 1950px) { #frame { transform: scale(calc((100vh - 40px) / 1920)); } }

  .photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .gradient {
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 22%,
                                         rgba(0,0,0,0) 38%, rgba(0,0,0,.92) 100%);
  }
  .topbar {
    position:absolute; top:180px; left:56px; right:56px; z-index:2;
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  .badge {
    background:var(--surface-chip); color:var(--surface-chipInk);
    padding:14px 22px 13px; border-radius:4px;
    font-family:"Geist Mono",monospace; font-size:20px; letter-spacing:.16em;
    text-transform:uppercase; font-weight:600;
    display:inline-flex; align-items:center; gap:14px;
  }
  .badge::before { content:""; width:8px; height:8px; border-radius:50%;
                   background:var(--surface-chipInk); opacity:.9; }
  .wordmark {
    display:inline-flex; align-items:center; gap:10px; color:#fff;
    font-family:"Instrument Serif",serif; font-size:26px; font-style:italic; line-height:1;
  }
  .wordmark svg { width:30px; height:30px; }
  .content {
    position:absolute; left:56px; right:56px; bottom:320px; z-index:2;
    display:flex; gap:28px; align-items:flex-end;
  }
  .stripe { width:6px; align-self:stretch; background:var(--surface-accent);
            border-radius:3px; min-height:280px; }
  .kicker {
    font-family:"Geist Mono",monospace; color:var(--surface-accent);
    font-size:22px; letter-spacing:.2em; text-transform:uppercase;
    font-weight:500; margin-bottom:22px;
  }
  .title {
    font-family:"Instrument Serif",serif; color:#fff; font-size:110px;
    line-height:1.0; margin:0; font-weight:400; letter-spacing:-.02em; text-wrap:balance;
  }
  .subtitle {
    color:rgba(255,255,255,.85); font-size:30px; line-height:1.35;
    margin:28px 0 0; max-width:820px; text-wrap:pretty;
  }
  .footer-strip {
    position:absolute; bottom:220px; left:56px; right:56px;
    display:flex; justify-content:space-between;
    font-family:"Geist Mono",monospace; font-size:18px;
    letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.6);
  }
</style>
</head>
<body>
  <div id="frame"></div>

  <script>
    const SURFACES = {
      hard:    { accent:'#3B82F6', chip:'#1E40AF', chipInk:'#F5F8FF' },
      grass:   { accent:'#3DA15A', chip:'#1F6F3C', chipInk:'#F2F8EE' },
      clay:    { accent:'#E76A2A', chip:'#B4441C', chipInk:'#FFF4EC' },
      neutral: { accent:'#D4B96A', chip:'#1A1A1C', chipInk:'#F4F1EA' },
    };
    const wordmarkSVG = `
      <span class="wordmark">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <circle cx="14" cy="14" r="12" fill="none" stroke="#fff" stroke-width="1.6"></circle>
          <path d="M3 9 Q14 14 25 9" fill="none" stroke="#fff" stroke-width="1.6"></path>
          <path d="M3 19 Q14 14 25 19" fill="none" stroke="#fff" stroke-width="1.6"></path>
        </svg>
        <span>café com tênis</span>
      </span>`;

    function render() {
      const data = JSON.parse(document.getElementById('post-data').textContent);
      const s = SURFACES[data.surface] || SURFACES.neutral;
      const r = document.documentElement.style;
      r.setProperty('--surface-accent',  s.accent);
      r.setProperty('--surface-chip',    s.chip);
      r.setProperty('--surface-chipInk', s.chipInk);

      document.getElementById('frame').innerHTML = `
        <img class="photo" src="${data.image}" alt="" />
        <div class="gradient"></div>
        <div class="topbar">
          <div class="badge">${data.badge}</div>
          ${wordmarkSVG}
        </div>
        <div class="content">
          <div class="stripe"></div>
          <div style="flex:1; min-width:0;">
            ${data.kicker ? `<div class="kicker">${data.kicker}</div>` : ''}
            <h1 class="title">${data.title}</h1>
            <p class="subtitle">${data.subtitle}</p>
          </div>
        </div>
        <div class="footer-strip">
          <span>${data.credit || ''}</span>
          <span>@cafecomteniss</span>
        </div>`;
    }
    render();
  </script>
</body>
</html>
