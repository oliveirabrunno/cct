name: H2H Poll Story — 17h BRT

# Story de engajamento "Quem leva?" com H2H entre dois jogadores em trend.
# Roda às 17:00 BRT (20:00 UTC) — janela pré-partidas noturnas

on:
  workflow_dispatch:
  # PAUSADO — retomar quando Meta API e token estiverem resolvidos
  # schedule:
  #   - cron: "0 20 * * *"

concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  h2h_poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Node deps
        run: npm ci

      - name: Get current date
        id: get-date
        run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Cache dados persistentes (dedup DB + fotos de jogadores)
        uses: actions/cache@v4
        with:
          path: |
            data/database.sqlite
            data/players
          key: data-cache-v5-${{ steps.get-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            data-cache-v5-${{ steps.get-date.outputs.date }}-
            data-cache-v5-

      - name: Gerar H2H Poll Story
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: python orchestrator.py h2h-poll

      - name: Upload output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2h-poll-${{ github.run_id }}
          path: output/queue/
          retention-days: 3
