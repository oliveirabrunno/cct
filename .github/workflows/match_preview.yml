name: Match Preview — Pré-jogo 07h BRT

# Publica carrossel de análise pré-jogo com H2H real + análise técnica.
# Roda às 07:00 BRT (10:00 UTC) todos os dias de torneio.
# Uso manual: informar os dois jogadores como input.
# Objetivo: ser o primeiro canal a postar análise antes da partida.

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 07:00 BRT
  workflow_dispatch:
    inputs:
      player_a:
        description: "Jogador A (ex: Fonseca, Sinner)"
        required: false
        default: ""
      player_b:
        description: "Jogador B (ex: Djokovic, Zverev)"
        required: false
        default: ""
      round_info:
        description: "Fase (ex: '1ª Rodada', 'Quartas')"
        required: false
        default: "Roland Garros 2026"

concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  match_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium
          restore-keys: playwright-${{ runner.os }}-

      - name: Install system deps
        run: sudo apt-get install -y ffmpeg --no-install-recommends

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Node deps
        run: npm ci

      - name: Install Playwright (chromium only)
        run: python -m playwright install chromium --with-deps

      - name: Get current date
        id: get-date
        run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Cache dados persistentes (dedup DB + fotos de jogadores)
        uses: actions/cache@v4
        with:
          path: |
            data/database.sqlite
            data/players
          key: data-cache-v5-${{ steps.get-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            data-cache-v5-${{ steps.get-date.outputs.date }}-
            data-cache-v5-

      - name: Gerar match preview
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.player_a }}" ] && [ -n "${{ github.event.inputs.player_b }}" ]; then
            python orchestrator.py match-preview "${{ github.event.inputs.player_a }}" "${{ github.event.inputs.player_b }}" "${{ github.event.inputs.round_info || 'Roland Garros 2026' }}"
          else
            python orchestrator.py match-preview
          fi

      - name: Upload output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-preview-${{ github.run_id }}
          path: output/queue/
          retention-days: 3
