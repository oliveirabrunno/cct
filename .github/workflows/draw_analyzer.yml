name: Chaveamento de Torneio

# Gera carrosséis de chaveamento (draw path) para os top 4 + Fonseca + Bia.
# Roda sexta (torneios que começam sábado) e domingo (torneios que começam segunda).
# Também pode ser disparado manualmente com filtro de jogador.

on:
  schedule:
    - cron: "0 12 * * 5"   # Sexta 09:00 BRT — prep para torneios fim de semana
    - cron: "0 12 * * 0"   # Domingo 09:00 BRT — prep para torneios semana
  workflow_dispatch:
    inputs:
      player:
        description: "Jogador específico (ex: fonseca, sinner) — vazio para geral ATP+WTA"
        required: false
        default: ""

concurrency:
  group: draw-analyzer
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium
          restore-keys: playwright-${{ runner.os }}-

      - name: Install system deps
        run: sudo apt-get install -y ffmpeg --no-install-recommends

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Node deps
        run: npm ci

      - name: Install Playwright (chromium only)
        run: python -m playwright install chromium --with-deps

      - name: Cache dados persistentes (dedup DB + fotos de jogadores)
        uses: actions/cache@v4
        with:
          path: |
            data/database.sqlite
            data/players
          key: data-cache-v3-${{ github.run_id }}
          restore-keys: data-cache-v3-

      - name: Gerar carrosséis de chaveamento
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: python orchestrator.py draw-path ${{ github.event.inputs.player || '' }}

      - name: Publicar stories de teaser do draw
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
        run: python orchestrator.py stories
        continue-on-error: true

      - name: Upload output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draw-analyzer-${{ github.run_id }}
          path: output/queue/
          retention-days: 7
