name: Afternoon Insight — 15h BRT

# Publica 1 card de insight educativo às 15:00 BRT (18:00 UTC)
# Seleção inteligente: H2H pré-jogo → stats ATP avançados → líderes da temporada
# Antes deste workflow, o handler run_afternoon_insight nunca rodava automaticamente

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  afternoon_insight:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Node deps
        run: npm ci

      - name: Install Playwright (chromium only)
        run: python -m playwright install chromium --with-deps

      - name: Get current date
        id: get-date
        run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Cache dados persistentes (dedup DB + fotos de jogadores)
        uses: actions/cache@v4
        with:
          path: |
            data/database.sqlite
            data/players
          key: data-cache-v5-${{ steps.get-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            data-cache-v5-${{ steps.get-date.outputs.date }}-
            data-cache-v5-

      - name: Gerar Afternoon Insight (H2H / Stats / Season Leaders)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: python orchestrator.py afternoon-insight

      - name: Upload output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afternoon-insight-${{ github.run_id }}
          path: output/queue/
          retention-days: 3
