name: Stories — 3x por Dia

# Motor de engajamento contínuo: 3 slots de stories por dia
# 10:00 BRT (13:00 UTC) → stories manhã
# 15:00 BRT (18:00 UTC) → stories tarde
# 19:30 BRT (22:30 UTC) → stories noite
# Stories NÃO consomem quota de feed posts (Meta)

on:
  schedule:
    - cron: "0 13 * * *"    # 10:00 BRT
    - cron: "0 18 * * *"    # 15:00 BRT
    - cron: "30 22 * * *"   # 19:30 BRT
  workflow_dispatch:

concurrency:
  group: stories-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Node deps
        run: npm ci

      - name: Install Playwright (chromium only)
        run: python -m playwright install chromium --with-deps

      - name: Cache dados persistentes (dedup DB + fotos de jogadores)
        uses: actions/cache@v4
        with:
          path: |
            data/database.sqlite
            data/players
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: Publicar Stories (3 variados)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: python orchestrator.py stories

      - name: Upload output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stories-${{ github.run_id }}
          path: output/queue/
          retention-days: 1
